<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Edvanta — Learn Your Way banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B24"/>
      <stop offset="1" stop-color="#141436"/>
    </linearGradient>
    <linearGradient id="glowA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5A3C"/>
      <stop offset="0.5" stop-color="#F93A8A"/>
      <stop offset="1" stop-color="#B9B8FF"/>
    </linearGradient>
    <linearGradient id="glowB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E7C86"/>
      <stop offset="1" stop-color="#14B8C6"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>

  <!-- soft glows echoing the landing-page artwork -->
  <circle cx="1050" cy="180" r="130" fill="#F93A8A" opacity="0.28"/>
  <circle cx="960" cy="250" r="80" fill="#FF5A3C" opacity="0.25"/>
  <circle cx="1140" cy="290" r="46" fill="#B9B8FF" opacity="0.30"/>
  <circle cx="1120" cy="90" r="34" fill="#FFFFFF" opacity="0.12"/>

  <!-- neon swoosh -->
  <path d="M 900 300 C 880 180 1000 130 1060 170 C 1120 210 1080 290 1010 270 C 950 253 970 180 1040 190"
        fill="none" stroke="url(#glowA)" stroke-width="34" stroke-linecap="round" opacity="0.95"/>
  <path d="M 900 300 C 880 180 1000 130 1060 170 C 1120 210 1080 290 1010 270 C 950 253 970 180 1040 190"
        fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.35"/>

  <!-- logo mark -->
  <g transform="translate(90,110)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="#0E7C86"/>
    <rect x="0" y="0" width="96" height="96" rx="22" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.25"/>
    <!-- graduation cap -->
    <path d="M48 26 L84 42 L48 58 L12 42 Z" fill="#FFFFFF"/>
    <path d="M30 50 L30 66 L48 74 L66 66 L66 50 L48 58 Z" fill="#B9F1F5"/>
    <rect x="68" y="42" width="5" height="22" rx="2" fill="#FFFFFF"/>
    <circle cx="70.5" cy="68" r="5" fill="#FFFFFF"/>
    <!-- spark -->
    <path d="M48 62 L51 70 L59 73 L51 76 L48 84 L45 76 L37 73 L45 70 Z" fill="#0B0B24" opacity="0.85"/>
  </g>

  <text x="210" y="162" font-family="Verdana, Arial, sans-serif" font-size="64" font-weight="bold" letter-spacing="10" fill="#FFFFFF">EDVANTA</text>
  <text x="212" y="200" font-family="Verdana, Arial, sans-serif" font-size="22" letter-spacing="4" fill="#8E8EA8">LEARN YOUR WAY</text>
  <text x="212" y="240" font-family="Verdana, Arial, sans-serif" font-size="19" fill="#C9C9DE">Structured courses &#183; Server-graded quizzes &#183; Verified certificates</text>

  <!-- tech pills -->
  <g font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="bold">
    <rect x="212" y="268" width="210" height="40" rx="20" fill="#B9F1F5"/>
    <text x="317" y="294" text-anchor="middle" fill="#0B0B24">React 18 + Vite 6</text>
    <rect x="434" y="268" width="230" height="40" rx="20" fill="#FFFFFF"/>
    <text x="549" y="294" text-anchor="middle" fill="#0B0B24">Spring Boot 3 &#183; Java 21</text>
    <rect x="676" y="268" width="150" height="40" rx="20" fill="none" stroke="#B9F1F5" stroke-width="2"/>
    <text x="751" y="294" text-anchor="middle" fill="#B9F1F5">MySQL 8</text>
    <rect x="838" y="268" width="130" height="40" rx="20" fill="none" stroke="#F93A8A" stroke-width="2"/>
    <text x="903" y="294" text-anchor="middle" fill="#F9A8D4">JWT Auth</text>
  </g>

  <text x="212" y="350" font-family="Verdana, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#8E8EA8">LEARNER  &#183;  INSTRUCTOR  &#183;  ADMINISTRATOR</text>
</svg>
